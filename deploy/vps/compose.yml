name: syco23-mixsets

services:
  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: syco23-mixsets-api:${MIXSETS_IMAGE_TAG:-local}
    container_name: syco23-mixsets-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s
    environment:
      PORT: 8787
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://syco23-mixsets.vercel.app}
      SOUNDCLOUD_ACCESS_TOKEN: ${SOUNDCLOUD_ACCESS_TOKEN:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
    ports:
      - "127.0.0.1:8793:8787"
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: syco23-ftm_default
